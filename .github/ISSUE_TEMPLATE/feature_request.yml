name: Feature request
description: Suggest an enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New storage provider
        - New notification channel
        - CLI / menu
        - Jenkins pipeline
        - Packaging / release
        - Other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
